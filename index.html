
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Royal Computer - QR Attendance Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0 0 8px;
      color: #174ea6;
    }

    .header p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      margin: 16px 0;
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .student-card {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      background: #f8fbff;
    }

    .student-card h3 {
      text-align: center;
      color: #174ea6;
      margin-top: 0;
    }

    .info {
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .info:last-child { border-bottom: none; }

    .info strong {
      display: inline-block;
      width: 110px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #switchCameraBtn { background: #475569; }
    #restartBtn {
      display: none;
      background: #15803d;
    }

    #debugPanel {
      display: block;
      margin-top: 12px;
      padding: 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      font-size: 13px;
      color: #9a3412;
      overflow-wrap: anywhere;
    }

    #debugLog {
      white-space: pre-wrap;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>Royal Computer</h2>
    <p>Training Center - QR Attendance Scanner</p>
  </div>

  <div id="reader"></div>

  <button id="switchCameraBtn" onclick="switchCamera()" disabled>
    Front / Back Camera পরিবর্তন
  </button>

  <div id="status">
    ক্যামেরা চালু করে শিক্ষার্থীর QR Code Scan করুন।
  </div>

  
  <div id="studentCard" class="student-card">
    <h3>Student Information</h3>

    <div class="info">
      <strong>Form No:</strong>
      <span id="formNo"></span>
    </div>

    <div class="info">
      <strong>Name:</strong>
      <span id="studentName"></span>
    </div>

    <div class="info">
      <strong>Course:</strong>
      <span id="course"></span>
    </div>
  </div>

  <button id="restartBtn" onclick="restartScanner()">
    Scan Another Student
  </button>

  <div class="footer">
    Royal Computer Training Center<br>
    QR Attendance Management System
  </div>

  <div id="debugPanel">
    <strong>DEBUG INFORMATION</strong>
    <pre id="debugLog">Scanner starting...</pre>
  </div>
  
</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyc7ivJIu27JPmVc0xYRIdBdvkRfQW_pOBA2tsTNLy4NCFtF266WnI9rBZADbNTEMnPQQ/exec";

let scanner = null;
let scannerRunning = false;
let processing = false;
let cameras = [];
let currentCameraIndex = 0;
let lookupTimeout = null;

const statusBox = document.getElementById("status");
const studentCard = document.getElementById("studentCard");
const restartBtn = document.getElementById("restartBtn");
const switchCameraBtn = document.getElementById("switchCameraBtn");


function setStatus(message) {
  statusBox.textContent = message;
}


function showDebug(message) {
  const log = document.getElementById("debugLog");
  const time = new Date().toLocaleTimeString();

  log.textContent +=
    "\n[" + time + "] " + message;
}


async function loadCameras() {

  showDebug("Loading available cameras...");

  cameras = await Html5Qrcode.getCameras();

  if (!cameras || cameras.length === 0) {
    throw new Error("কোনো Camera পাওয়া যায়নি।");
  }

  const backIndex = cameras.findIndex(camera =>
    /back|rear|environment/i.test(camera.label)
  );

  currentCameraIndex = backIndex >= 0 ? backIndex : 0;

  showDebug("Camera found: " + cameras.length);

  switchCameraBtn.disabled = cameras.length < 2;
}


async function startScanner() {

  try {

    if (scannerRunning) return;

    if (!window.Html5Qrcode) {
      throw new Error("QR Scanner Library Load হয়নি।");
    }

    if (!cameras.length) {
      await loadCameras();
    }

    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    setStatus("ক্যামেরা চালু হচ্ছে...");
    showDebug("Starting camera...");

    await scanner.start(
      cameras[currentCameraIndex].id,
      {
        fps: 10,
        qrbox: { width: 230, height: 230 }
      },
      onScanSuccess,
      function () {}
    );

    scannerRunning = true;

    switchCameraBtn.disabled = cameras.length < 2;

    setStatus("QR Code Scan করার জন্য প্রস্তুত।");
    showDebug("Camera started successfully.");

  } catch (error) {

    console.error("Camera Error:", error);

    scannerRunning = false;

    setStatus("Camera Error: " + error.message);
    showDebug("CAMERA ERROR: " + error.message);

    switchCameraBtn.disabled = true;
  }
}


async function onScanSuccess(decodedText) {

  if (processing) return;

  processing = true;

  setStatus("QR Code পাওয়া গেছে। শিক্ষার্থীর তথ্য যাচাই হচ্ছে...");

  showDebug("QR detected. Starting student lookup.");

  await stopScanner();

  lookupStudent(decodedText);
}


function lookupStudent(token) {

  const callbackName =
    "handleStudentLookup_" + Date.now();

  let responseReceived = false;

  showDebug("Sending Student Lookup Request...");

  const script = document.createElement("script");
  script.id = "apiScript";

  function cleanup() {

    delete window[callbackName];

    if (script.parentNode) {
      script.remove();
    }

    if (lookupTimeout) {
      clearTimeout(lookupTimeout);
      lookupTimeout = null;
    }
  }


  window[callbackName] = function(result) {

    if (responseReceived) return;

    responseReceived = true;

    cleanup();

    showDebug("API response received.");

    if (result && result.success) {

      document.getElementById("formNo").textContent =
        result.formNo;

      document.getElementById("studentName").textContent =
        result.name;

      document.getElementById("course").textContent =
        result.course;

      studentCard.style.display = "block";

      setStatus("সফল! শিক্ষার্থীর তথ্য পাওয়া গেছে.");

      showDebug("Student lookup successful.");
      showDebug("Form No: " + result.formNo);
      showDebug("Course: " + result.course);

    } else {

      studentCard.style.display = "none";

      const message =
        result && result.message
          ? result.message
          : "শিক্ষার্থীর তথ্য পাওয়া যায়নি।";

      setStatus(message);
      showDebug("API returned error: " + message);
    }

    restartBtn.style.display = "block";
  };


  script.onerror = function(error) {

    if (responseReceived) return;

    responseReceived = true;

    cleanup();

    console.error("API SCRIPT ERROR:", error);

    setStatus("Backend API Script Load Failed.");

    showDebug("API SCRIPT LOAD ERROR.");
    showDebug("Browser could not load the API response script.");
    showDebug("Check API deployment, redirect and network access.");

    restartBtn.style.display = "block";
  };


  const requestUrl =
    API_URL +
    "?action=lookup" +
    "&token=" + encodeURIComponent(token) +
    "&callback=" + callbackName +
    "&_=" + Date.now();

  // Token গোপন রেখে শুধু Request-এর সাধারণ তথ্য দেখানো হচ্ছে
  showDebug("Request URL: Apps Script API");
  showDebug("Action: lookup");
  showDebug("JSONP callback: " + callbackName);

  script.src = requestUrl;

  document.body.appendChild(script);


  lookupTimeout = setTimeout(function() {

    if (!responseReceived) {

      responseReceived = true;

      cleanup();

      setStatus("API Response পাওয়া যায়নি। আবার চেষ্টা করুন।");

      showDebug("API TIMEOUT: No response within 15 seconds.");

      restartBtn.style.display = "block";
    }

  }, 15000);

}


async function stopScanner() {

  if (scanner && scannerRunning) {

    try {
      await scanner.stop();
    } catch (error) {
      console.error("Scanner Stop Error:", error);
      showDebug("Scanner stop error: " + error.message);
    }

    scannerRunning = false;
  }
}


async function switchCamera() {

  if (cameras.length < 2 || processing) return;

  switchCameraBtn.disabled = true;

  await stopScanner();

  currentCameraIndex =
    (currentCameraIndex + 1) % cameras.length;

  showDebug(
    "Switching camera: " +
    (currentCameraIndex + 1)
  );

  setStatus("Camera পরিবর্তন হচ্ছে...");

  await startScanner();
}


async function restartScanner() {

  studentCard.style.display = "none";
  restartBtn.style.display = "none";

  processing = false;

  setStatus("নতুন QR Code Scan করার জন্য প্রস্তুত.");

  showDebug("Scanner restarted.");

  await startScanner();
}


window.addEventListener("load", function() {

  showDebug("Website loaded.");
  startScanner();

});

</script>

</body>
</html>
